<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b"/>
      <stop offset=".55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(470 150) rotate(90) scale(260)">
      <stop stop-color="#a855f7" stop-opacity=".9"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(140 520) rotate(90) scale(280)">
      <stop stop-color="#22d3ee" stop-opacity=".75"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="250" y1="170" x2="430" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0abfc"/>
      <stop offset=".5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#ffffff" stroke-opacity=".06"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#grid)"/>
  <circle cx="470" cy="150" r="260" fill="url(#glowA)"/>
  <circle cx="140" cy="520" r="280" fill="url(#glowB)"/>

  <!-- central orb -->
  <circle cx="340" cy="280" r="120" fill="url(#orb)" filter="url(#blur)" opacity=".7"/>
  <circle cx="340" cy="280" r="104" fill="url(#orb)"/>
  <ellipse cx="310" cy="236" rx="46" ry="26" fill="#ffffff" opacity=".35" transform="rotate(-28 310 236)"/>
  <ellipse cx="340" cy="280" rx="170" ry="40" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.5" transform="rotate(-18 340 280)"/>

  <!-- code window -->
  <g transform="translate(56 92)">
    <rect width="250" height="172" rx="18" fill="url(#glass)" stroke="url(#stroke)"/>
    <circle cx="22" cy="22" r="5" fill="#f87171"/>
    <circle cx="40" cy="22" r="5" fill="#fbbf24"/>
    <circle cx="58" cy="22" r="5" fill="#34d399"/>
    <rect x="20" y="50" width="70" height="8" rx="4" fill="#c4b5fd"/>
    <rect x="98" y="50" width="96" height="8" rx="4" fill="#ffffff" fill-opacity=".5"/>
    <rect x="36" y="70" width="54" height="8" rx="4" fill="#67e8f9"/>
    <rect x="98" y="70" width="120" height="8" rx="4" fill="#ffffff" fill-opacity=".35"/>
    <rect x="36" y="90" width="110" height="8" rx="4" fill="#f9a8d4"/>
    <rect x="154" y="90" width="44" height="8" rx="4" fill="#ffffff" fill-opacity=".35"/>
    <rect x="52" y="110" width="80" height="8" rx="4" fill="#ffffff" fill-opacity=".5"/>
    <rect x="140" y="110" width="60" height="8" rx="4" fill="#a5b4fc"/>
    <rect x="36" y="130" width="64" height="8" rx="4" fill="#67e8f9"/>
    <rect x="20" y="150" width="30" height="8" rx="4" fill="#c4b5fd"/>
  </g>

  <!-- chart card -->
  <g transform="translate(372 392)">
    <rect width="214" height="150" rx="18" fill="url(#glass)" stroke="url(#stroke)"/>
    <rect x="20" y="20" width="64" height="8" rx="4" fill="#ffffff" fill-opacity=".6"/>
    <rect x="20" y="36" width="40" height="14" rx="4" fill="#ffffff"/>
    <rect x="24" y="100" width="18" height="30" rx="5" fill="url(#bar)" opacity=".7"/>
    <rect x="52" y="84" width="18" height="46" rx="5" fill="url(#bar)" opacity=".8"/>
    <rect x="80" y="92" width="18" height="38" rx="5" fill="url(#bar)" opacity=".75"/>
    <rect x="108" y="70" width="18" height="60" rx="5" fill="url(#bar)" opacity=".9"/>
    <rect x="136" y="58" width="18" height="72" rx="5" fill="url(#bar)"/>
    <rect x="164" y="40" width="18" height="90" rx="5" fill="url(#bar)"/>
  </g>

  <!-- profile chip -->
  <g transform="translate(70 446)">
    <rect width="236" height="76" rx="38" fill="url(#glass)" stroke="url(#stroke)"/>
    <circle cx="38" cy="38" r="24" fill="url(#orb)"/>
    <rect x="74" y="24" width="96" height="10" rx="5" fill="#ffffff" fill-opacity=".85"/>
    <rect x="74" y="42" width="130" height="8" rx="4" fill="#ffffff" fill-opacity=".4"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M520 300l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" opacity=".9"/>
    <path d="M200 330l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity=".7"/>
    <path d="M560 90l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity=".6"/>
    <circle cx="120" cy="330" r="2" opacity=".6"/>
    <circle cx="470" cy="360" r="2.5" opacity=".7"/>
    <circle cx="300" cy="580" r="2" opacity=".5"/>
    <circle cx="420" cy="70" r="2" opacity=".6"/>
  </g>
</svg>
